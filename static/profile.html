<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduShare | Profile</title>
    <style>
        :root {
            --bg-image: url('students.png'); 
            --glass-bg: rgba(255, 255, 255, 0.12); 
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --box-bg: rgba(255, 255, 255, 0.08);
            --sidebar-color: #4f46e5;
        }

        .dark-theme {
            --glass-bg: rgba(0, 0, 0, 0.5);
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --box-bg: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            box-shadow: inset 0 0 0 1000px rgba(0,0,0,0.4); 
        }

        /* Sidebar - Matching Dashboard/Browse */
        .sidebar {
            width: 240px;
            background: var(--sidebar-color);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .logo { font-size: 22px; font-weight: bold; margin-bottom: 30px; }

        .sidebar a {
            display: block;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            cursor: pointer;
        }

        .sidebar a:hover, .sidebar .active {
            background: rgba(255,255,255,0.2);
        }

        /* Profile Container */
        .profile-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            color: var(--text-color);
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { padding: 40px 20px 20px; text-align: center; }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--accent-color), #4f46e5);
            border: 3px solid var(--glass-border);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .content { padding: 0 35px 40px; }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 210, 255, 0.2);
            color: var(--accent-color);
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin: 25px 0 15px;
            display: block;
            font-weight: bold;
            opacity: 0.9;
        }

        .settings-row { display: flex; gap: 12px; }

        .setting-item {
            flex: 1;
            background: var(--box-bg);
            padding: 15px 5px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .setting-item span {
            display: block;
            font-size: 0.6rem;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .setting-item button, .setting-item select {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 6px;
            border-radius: 8px;
            width: 85%;
            cursor: pointer;
            font-size: 0.7rem;
            outline: none;
        }

        .info-list { list-style: none; margin-top: 10px; }
        .info-list li { padding: 15px 0; border-bottom: 1px solid var(--glass-border); }
        .info-list a {
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .logout {
            margin-top: 35px;
            display: block;
            text-align: center;
            color: #ff7675;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 118, 117, 0.1);
        }
        
        .logout:hover { background: rgba(255, 118, 117, 0.2); }

        @media(max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">EduShare</div>
        <a href="dashboard.html">Dashboard</a>
        <a href="browse.html">Browse Resources</a>
        <a href="upload.html">Upload</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="profile.html" class="active">Profile</a>
    </div>

    <div class="profile-container">
        <div class="profile-card">
            <div class="header">
                <div class="avatar" id="initial">S</div>
                <h1 id="welcome">Welcome, <span id="uName">Student</span></h1>
                <div class="role-badge" id="uRole">Student</div>
                <p id="uEmail" style="opacity: 0.7; font-size: 0.9rem;">email@student.com</p>
            </div>

            <div class="content">
                <span class="section-label">General Settings</span>
                <div class="settings-row">
                    <div class="setting-item">
                        <span>Appearance</span>
                        <button onclick="toggle()">Theme</button>
                    </div>
                    <div class="setting-item">
                        <span>Security</span>
                        <button>Privacy</button>
                    </div>
                    <div class="setting-item">
                        <span>Language</span>
                        <select id="lang" onchange="translateText()">
                            <option value="en">EN</option>
                            <option value="ta">தமிழ்</option>
                        </select>
                    </div>
                </div>

                <span class="section-label">Information</span>
                <ul class="info-list">
                    <li><a href="#">About EduShare <span>&rsaquo;</span></a></li>
                    <li><a href="#">Terms of Service <span>&rsaquo;</span></a></li>
                    <li><a href="#">Privacy Policy <span>&rsaquo;</span></a></li>
                </ul>

                <a class="logout" onclick="logout()">Log Out from System</a>
            </div>
        </div>
    </div>

    <script>
        // Use the same keys as your Login script
        const userName = localStorage.getItem('userName') || "Student";
        const userEmail = localStorage.getItem('userEmail') || "guest@univ.edu";
        const userRole = localStorage.getItem('userRole') || "Student";

        document.getElementById('uName').innerText = userName;
        document.getElementById('uEmail').innerText = userEmail;
        document.getElementById('uRole').innerText = userRole;
        document.getElementById('initial').innerText = userName.charAt(0).toUpperCase();

        function toggle() {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        function translateText() {
            const l = document.getElementById('lang').value;
            const w = document.getElementById('welcome');
            w.innerHTML = (l === 'ta') ? `வரவேற்கிறோம், ${userName}` : `Welcome, ${userName}`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
