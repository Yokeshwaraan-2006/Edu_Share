<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduShare | Faculty Portal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background: var(--primary);
            color: white;
            padding: 30px;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            transition: 0.3s;
        }

        .sidebar a:hover, 
        .sidebar .active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateX(5px);
        }

        /* --- MAIN CONTENT --- */
        .main {
            flex: 1;
            padding: 40px;
        }

        .hero-banner {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 40px;
            border-radius: 20px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card p {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-card h3 {
            font-size: 32px;
            font-weight: 800;
        }

        /* --- QUEUE SECTION --- */
        .queue-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .queue-item:last-child {
            border-bottom: none;
        }

        .btn-review {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>EduShare 🛡️</h2>
        <a href="faculty_dashboard.html" class="active">📊 Overview</a>
        <a href="faculty_moderation.html">🛡️ Moderation Queue</a>
        <a href="browse.html">🔍 Library Browser</a>
        <a href="leaderboard.html">🏆 Leaderboard</a>
        <div style="margin-top: auto;">
            <a href="login.html" style="color: #fca5a5;">Logout</a>
        </div>
    </nav>

    <main class="main">
        <div class="hero-banner">
            <h1 id="welcome-name">Welcome, Professor</h1>
            <p>Institutional Moderation & Resource Verification Portal.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <p>Pending Review</p>
                <h3 id="pending-count" style="color: var(--warning);">0</h3>
            </div>
            <div class="stat-card">
                <p>Total Verified</p>
                <h3 id="verified-count" style="color: var(--success);">0</h3>
            </div>
            <div class="stat-card">
                <p>Total Resources</p>
                <h3 id="total-count">0</h3>
            </div>
        </div>

        <div class="queue-box">
            <h2 style="margin-bottom: 20px;">Recent Uploads Requiring Attention</h2>
            <div id="urgent-queue">
                </div>
        </div>
    </main>

    <script>
        const userName = localStorage.getItem('userName');
        document.getElementById('welcome-name').innerText = `Welcome, ${userName}`;

        async function loadDashboardStats() {
            try {
                const res = await fetch('http://127.0.0.1:5000/get-resources');
                const data = await res.json();
                
                const pending = data.filter(r => !r.is_verified);
                const verified = data.filter(r => r.is_verified);

                document.getElementById('total-count').innerText = data.length;
                document.getElementById('pending-count').innerText = pending.length;
                document.getElementById('verified-count').innerText = verified.length;

                const queue = document.getElementById('urgent-queue');
                if (pending.length === 0) {
                    queue.innerHTML = "<p>All caught up! No pending resources.</p>";
                } else {
                    queue.innerHTML = pending.slice(0, 3).map(item => `
                        <div class="queue-item">
                            <div>
                                <h4>${item.title}</h4>
                                <p style="font-size: 12px; color: var(--text-muted);">Uploader: ${item.uploader_name} | Course: ${item.course_name}</p>
                            </div>
                            <button class="btn-review" onclick="location.href='faculty_moderation.html'">Review</button>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        window.onload = loadDashboardStats;
    </script>
</body>
</html>
